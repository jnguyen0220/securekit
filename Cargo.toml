[package]
name = "secret_repo_scanner"
version = "0.1.0"
edition = "2021"

[lib]
name = "securekit"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1.10"
regex = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
axum = "0.7"
jsonwebtoken = "9"
base64 = "0.22"
hmac = "0.12"
httpdate = "1"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
